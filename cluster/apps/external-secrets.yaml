# External Secrets Operator: turns SSM parameters into Kubernetes Secrets.
# Runs on the micro node: its role may read /fitnessbuddy/prod/*, and hop limit 2 lets this pod reach IMDS.
# Has the finalizer: removing this file should uninstall ESO (unlike platform.yaml, which owns data).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: external-secrets
    namespace: argocd
    finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
    project: default
    source:
        repoURL: https://charts.external-secrets.io
        chart: external-secrets
        targetRevision: 2.15.0
        helm:
            valuesObject:
                installCRDs: true
                crds: # only SecretStore, ClusterSecretStore and ExternalSecret are used
                    createClusterExternalSecret: false
                    createPushSecret: false
                    createClusterPushSecret: false
                    createClusterGenerator: false
                    conversion: { enabled: false } # must stay false with the webhook off
                # each crds.create*=false needs its process*=false (chart comment)
                processClusterExternalSecret: false
                processPushSecret: false
                processClusterPushSecret: false
                processClusterGenerator: false
                webhook: { create: false } # saves a pod; typos surface as sync errors, not at apply
                certController: { create: false } # only serves the webhook
                nodeSelector: { fitnessbuddy.io/pool: db }
                tolerations:
                    - { key: dedicated, operator: Equal, value: postgres, effect: NoSchedule }
                resources: # first guess, measured at the phase-7 RAM gate
                    requests: { cpu: 10m, memory: 64Mi }
                    limits: { memory: 192Mi }
    destination:
        server: https://kubernetes.default.svc
        namespace: external-secrets
    syncPolicy:
        automated: { enabled: true, prune: true, selfHeal: true }
        syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true # ESO's CRDs exceed the 256 KB client-side annotation limit
        retry: { limit: 10, backoff: { duration: 15s, factor: 2, maxDuration: 5m } }
