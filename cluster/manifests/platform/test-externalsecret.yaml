apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    name: eso-test
    namespace: default
spec:
    refreshInterval: 1h
    secretStoreRef:
        kind: ClusterSecretStore
        name: aws-ssm
    target:
        name: eso-test
        creationPolicy: Owner
    data:
        - secretKey: USDA_API_KEY
          remoteRef:
              key: /fitnessbuddy/prod/usda-api-key
