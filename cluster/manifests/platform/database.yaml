# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
    name: fitnessbuddy-db
    namespace: fitnessbuddy
    annotations:
        argocd.argoproj.io/sync-options: Prune=false # Argo never deletes the database, even if this file leaves Git
spec:
    instances: 1
    imageName: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie
    bootstrap:
        initdb: { database: fitnessbuddy, owner: fitnessbuddy }
    storage: { size: 15Gi, storageClass: local-path }
    resources:
        requests: { memory: 384Mi }
        limits: { memory: 384Mi }
    postgresql:
        parameters: { shared_buffers: "96MB", max_connections: "30" }
    affinity:
        enablePodAntiAffinity: false
        nodeSelector: { fitnessbuddy.io/pool: db }
        tolerations:
            - { key: dedicated, operator: Equal, value: postgres, effect: NoSchedule }
    env:
        - name: AWS_REQUEST_CHECKSUM_CALCULATION
          value: when_required
        - name: AWS_RESPONSE_CHECKSUM_VALIDATION
          value: when_required
    backup:
        retentionPolicy: "7d"
        barmanObjectStore:
            destinationPath: s3://fitnessbuddy-pg-backups
            endpointURL: https://3d3bdbf16de0e8314afade0749d5dfbd.r2.cloudflarestorage.com
            s3Credentials:
                accessKeyId:
                    key: ACCESS_KEY_ID
                    name: pg-backup-r2
                secretAccessKey:
                    key: ACCESS_SECRET_KEY
                    name: pg-backup-r2
            wal:
                compression: gzip
            data:
                compression: gzip
