apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: fitnessbuddy-secrets, namespace: fitnessbuddy } # suggest: fitnessbuddy-secrets
spec:
    refreshInterval: 1h
    secretStoreRef:
        kind: ClusterSecretStore
        name: aws-ssm
    target:
        name: fitnessbuddy-secrets # the Secret the Deployment will envFrom
    data:
        - secretKey: JWT_SECRET
          remoteRef:
              key: /fitnessbuddy/prod/jwt-secret
        - secretKey: YOUTUBE_API_KEY
          remoteRef:
              key: /fitnessbuddy/prod/youtube-api-key
        - secretKey: USDA_API_KEY
          remoteRef:
              key: /fitnessbuddy/prod/usda-api-key
        - secretKey: R2_SECRET
          remoteRef:
              key: /fitnessbuddy/prod/r2-secret
        - secretKey: R2_ACCESS
          remoteRef:
              key: /fitnessbuddy/prod/r2-access
