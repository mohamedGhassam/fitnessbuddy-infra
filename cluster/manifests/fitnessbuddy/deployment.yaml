# Spring Boot API. One replica, Recreate: two JVMs don't fit in the ~700 MiB the app node has left
# (phase-7 RAM gate), and the in-memory rate limiter assumes a single instance.
# Runs on the app node: no toleration, so the db node's taint keeps it off.
apiVersion: apps/v1
kind: Deployment
metadata: { name: fitnessbuddy, namespace: fitnessbuddy }
spec:
    replicas: 1
    strategy: { type: Recreate } # old pod stops fully before the new one starts (~30-60 s downtime per deploy)
    selector:
        matchLabels: { app: fitnessbuddy }
    template:
        metadata:
            labels: { app: fitnessbuddy } # Alloy's Spring scrape keeps app=fitnessbuddy + port "management"
        spec:
            containers:
                - name: app
                  image: 071026217479.dkr.ecr.eu-north-1.amazonaws.com/fitnessbuddy:c11529f226512236713af34e803fd7455d0962d4 # CI rewrites this line (phase 10)
                  imagePullPolicy: IfNotPresent # tags are immutable in ECR
                  ports:
                      - { name: http, containerPort: 8080 } # API; the only port in the Service
                      - { name: management, containerPort: 8081 } # Actuator: probes + /actuator/prometheus, never routed
                  envFrom:
                      - configMapRef: { name: fitnessbuddy-config } # DB URL, Google client ID, R2 endpoint/bucket/public URL
                      - secretRef: { name: fitnessbuddy-secrets } # JWT, USDA, YouTube, R2 keys (ESO from SSM)
                  env:
                      # DB credentials generated by CloudNativePG; override the dev values in application.properties
                      - name: SPRING_DATASOURCE_USERNAME
                        valueFrom: { secretKeyRef: { name: fitnessbuddy-db-app, key: username } }
                      - name: SPRING_DATASOURCE_PASSWORD
                        valueFrom: { secretKeyRef: { name: fitnessbuddy-db-app, key: password } }
                      # JVM sizing for the 600Mi limit. -Xmx beats the Dockerfile's -XX:MaxRAMPercentage=65
                      # (65% of 600Mi heap + ~200 MB non-heap would be OOMKilled).
                      - name: JAVA_TOOL_OPTIONS
                        value: "-Xmx256m -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=64m -XX:+UseSerialGC -Xss512k"
                      - name: SERVER_TOMCAT_THREADS_MAX # 50 request threads instead of 200: less stack memory
                        value: "50"
                  resources:
                      requests: { cpu: 200m, memory: 600Mi }
                      limits: { memory: 600Mi } # request = limit: never swaps, evicted last. No CPU limit: throttling slows boot and probes
                  startupProbe: # up to 5 s x 30 = 150 s for JVM boot + Flyway; liveness waits for it
                      httpGet: { path: /actuator/health/liveness, port: management }
                      periodSeconds: 5
                      failureThreshold: 30
                  livenessProbe: # never includes the DB: a Postgres restart must not restart-loop Spring
                      httpGet: { path: /actuator/health/liveness, port: management }
                      periodSeconds: 10
                      failureThreshold: 3
                  readinessProbe: # includes the DB (readinessState,db): not ready = out of the Service, no restart
                      httpGet: { path: /actuator/health/readiness, port: management }
                      periodSeconds: 10
                      failureThreshold: 3
                  securityContext:
                      runAsNonRoot: true # image runs as 1000:1000
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities: { drop: [ALL] }
                  volumeMounts:
                      - { name: tmp, mountPath: /tmp } # Tomcat's work files; the rest of the filesystem is read-only
            volumes:
                - name: tmp
                  emptyDir: {}
